name: Android CDP Debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cdp:
    name: Inspect WebView over CDP
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Android SDK and NDK
        run: |
          sdkmanager_path=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > src-tauri/gen/android/local.properties

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build debug x86_64 APK
        run: pnpm tauri android build --apk --debug --target x86_64

      - name: Collect APK
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" helixnotes-x86_64-debug.apk

      - name: Write CDP inspector
        run: |
          cat > cdp-inspect.mjs <<'EOF'
          import fs from 'node:fs';

          const pages = await (await fetch('http://127.0.0.1:9222/json')).json();
          console.log('PAGES', JSON.stringify(pages, null, 2));
          const page = pages.find((p) => p.type === 'page') ?? pages[0];
          if (!page) throw new Error('no CDP page');

          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject; });
          let seq = 0;
          const waiting = new Map();
          const events = [];
          ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.id) { waiting.get(msg.id)?.(msg); waiting.delete(msg.id); }
            else {
              events.push(msg);
              if (msg.method === 'Runtime.exceptionThrown' || msg.method === 'Runtime.consoleAPICalled') {
                console.log('EVENT', JSON.stringify(msg).slice(0, 4000));
              }
            }
          };
          const send = (method, params = {}) => new Promise((resolve) => {
            const id = ++seq;
            waiting.set(id, resolve);
            ws.send(JSON.stringify({ id, method, params }));
          });

          await send('Runtime.enable');
          await send('Page.enable');
          const expression = `(() => {
            const el = document.querySelector('.vault-picker');
            const card = document.querySelector('.picker-card');
            const h1 = document.querySelector('h1');
            const button = document.querySelector('.btn-primary');
            const info = (node) => {
              if (!node) return null;
              const r = node.getBoundingClientRect();
              const cs = getComputedStyle(node);
              return {
                rect: { x: r.x, y: r.y, width: r.width, height: r.height },
                color: cs.color,
                backgroundColor: cs.backgroundColor,
                opacity: cs.opacity,
                visibility: cs.visibility,
                display: cs.display,
                transform: cs.transform,
                filter: cs.filter,
              };
            };
            return {
              url: location.href,
              ready: document.readyState,
              title: document.title,
              bodyText: document.body.innerText.slice(0, 4000),
              body: info(document.body),
              root: info(document.documentElement),
              picker: info(el),
              card: info(card),
              h1: info(h1),
              button: info(button),
              elementsAtCenter: document.elementsFromPoint(innerWidth / 2, 120).map((n) => n.className || n.tagName).slice(0, 10),
              htmlClass: document.documentElement.className,
              platform: window.__HELIX_PLATFORM__,
              stylesheets: [...document.styleSheets].map((sheet) => sheet.href),
              scripts: [...document.scripts].map((script) => script.src),
              animations: document.getAnimations().map((a) => ({ name: a.animationName, playState: a.playState, currentTime: a.currentTime })),
              rootHtml: document.documentElement.outerHTML.slice(0, 8000),
            };
          })()`;
          const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
          console.log('STATE', JSON.stringify(result.result?.result?.value ?? result, null, 2));
          const shot = await send('Page.captureScreenshot', { format: 'png', captureBeyondViewport: false, fromSurface: true });
          fs.writeFileSync('cdp-screen.png', Buffer.from(shot.result.data, 'base64'));
          const shotView = await send('Page.captureScreenshot', { format: 'png', captureBeyondViewport: false, fromSurface: false });
          fs.writeFileSync('cdp-screen-view.png', Buffer.from(shotView.result.data, 'base64'));
          await send('Runtime.evaluate', {
            expression: `(() => {
              document.documentElement.style.background = '#ff0000';
              document.body.style.background = '#ff0000';
              const picker = document.querySelector('.vault-picker');
              if (picker) picker.style.background = '#ff0000';
              const h1 = document.querySelector('h1');
              if (h1) { h1.style.color = '#0000ff'; h1.style.fontSize = '72px'; }
              return true;
            })()`,
            returnByValue: true,
          });
          const forced = await send('Page.captureScreenshot', { format: 'png', captureBeyondViewport: false, fromSurface: true });
          fs.writeFileSync('cdp-screen-forced.png', Buffer.from(forced.result.data, 'base64'));
          await send('Runtime.evaluate', {
            expression: `(() => {
              document.body.innerHTML = '<h1 style="color:#ff0000;font-size:88px;font-family:sans-serif">HELLO</h1><button style="background:#008000;color:#ffffff;font-size:48px;padding:20px">BUTTON</button>';
              document.body.style.background = '#ffff00';
              return document.body.innerText;
            })()`,
            returnByValue: true,
          });
          const injected = await send('Page.captureScreenshot', { format: 'png', captureBeyondViewport: false, fromSurface: true });
          fs.writeFileSync('cdp-screen-injected.png', Buffer.from(injected.result.data, 'base64'));
          fs.writeFileSync('cdp-events.json', JSON.stringify(events, null, 2));
          ws.close();
          EOF

      - name: Write emulator script
        run: |
          cat > run-cdp.sh <<'EOF'
          #!/usr/bin/env bash
          set -x
          adb install -r helixnotes-x86_64-debug.apk
          adb shell am start -W -n com.helixnotes.app/.MainActivity
          sleep 12
          pid=$(adb shell pidof com.helixnotes.app | tr -d '\r' | awk '{print $1}')
          echo "PID=$pid"
          adb shell cat /proc/net/unix | grep webview_devtools_remote || true
          socket=$(adb shell cat /proc/net/unix | tr -d '\r' | grep -o 'webview_devtools_remote_[0-9]*' | head -n 1)
          if [ -z "$socket" ] && [ -n "$pid" ]; then socket="webview_devtools_remote_$pid"; fi
          echo "SOCKET=$socket"
          test -n "$socket"
          adb forward --remove tcp:9222 || true
          adb forward tcp:9222 localabstract:"$socket"
          curl -s http://127.0.0.1:9222/json > pages.json || true
          cat pages.json
          node cdp-inspect.mjs > cdp-state.txt 2>&1 || true
          cat cdp-state.txt
          adb shell screencap -p /sdcard/screen2.png
          adb pull /sdcard/screen2.png screen2.png
          adb logcat -d > logcat2.txt
          EOF
          chmod +x run-cdp.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and inspect WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash run-cdp.sh

      - name: Upload debug output
        uses: actions/upload-artifact@v4
        with:
          name: android-cdp-debug
          path: |
            cdp-state.txt
            cdp-screen.png
            cdp-screen-view.png
            cdp-screen-forced.png
            cdp-screen-injected.png
            cdp-events.json
            pages.json
            screen2.png
            logcat2.txt
            helixnotes-x86_64-debug.apk
          if-no-files-found: warn

      - name: Publish debug output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload android-noteinfo-bdd46ed cdp-state.txt cdp-screen.png cdp-screen-view.png cdp-screen-forced.png cdp-screen-injected.png cdp-events.json pages.json screen2.png logcat2.txt --clobber -R "$GITHUB_REPOSITORY" || true
