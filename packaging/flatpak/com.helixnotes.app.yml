app-id: com.helixnotes.app
branch: stable
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: helixnotes

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --filesystem=xdg-run/tray-icon:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.FileManager1

build-options:
  append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: pnpm
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/pnpm /app/bin
      - cp -a . /app/lib/pnpm/
      - ln -s ../lib/pnpm/bin/pnpm.mjs /app/bin/pnpm
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.18.0.tgz
        sha256: 29c35ca8d2a287988fdee3e0f36e07d9b93783f567b579b7fd5b798a4563dd81

  - name: helixnotes
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/helixnotes/cargo
        CARGO_NET_OFFLINE: 'true'
        CARGO_BUILD_JOBS: '4'
        XDG_CACHE_HOME: /run/build/helixnotes/flatpak-node/cache
        HELIXNOTES_INSTALL_TYPE: flatpak
    build-commands:
      - pnpm install --offline --frozen-lockfile --trust-lockfile
      - pnpm tauri build --no-bundle
      - install -Dm755 src-tauri/target/release/helixnotes /app/bin/helixnotes
      - install -Dm644 packaging/flatpak/com.helixnotes.app.desktop /app/share/applications/com.helixnotes.app.desktop
      - install -Dm644 packaging/flatpak/com.helixnotes.app.metainfo.xml /app/share/metainfo/com.helixnotes.app.metainfo.xml
      - install -Dm644 src-tauri/icons/icon.svg /app/share/icons/hicolor/scalable/apps/com.helixnotes.app.svg
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.helixnotes.app.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.helixnotes.app.png
      - install -Dm644 LICENSE /app/share/licenses/com.helixnotes.app/LICENSE
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .agents
          - .codex
          - .aws
          - .claude
          - .env
          - .env.*
          - node_modules
          - .svelte-kit
          - .flatpak-builder
          - build
          - packaging/flatpak/.flatpak-builder
          - src-tauri/target
          - src-tauri/gen
      - cargo-sources.json
      - node-sources.json
